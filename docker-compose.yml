services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot-test-backend
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: copilot-test-frontend
    ports:
      - "4200:4200"
